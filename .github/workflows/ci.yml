name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo timeout 120 apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::ForceIPv4=true \
            || echo "apt-get update не завершился вовремя; используются текущие списки"
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libmpv-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Actions are pinned by full commit SHA
        run: |
          unpinned=$(grep -rhoE '^[[:space:]]*uses:[[:space:]]*[^[:space:]]+' .github/workflows \
            | sed 's/.*uses:[[:space:]]*//' \
            | grep -vE '^\.|@[0-9a-f]{40}$' || true)
          if [ -n "$unpinned" ]; then
            echo "Экшены пинуются полным SHA, версия — комментарием:" >&2
            printf '  %s\n' "$unpinned" >&2
            exit 1
          fi

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Сборка без фичи `tray` больше нигде не исполняется, а именно там прячутся
      # платформенные dead_code-сюрпризы уровня трей-линтов macOS.
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test --all-targets

  # Контур поставки (QA-01). Отдельный job, а не шаг в `checks`: он не требует
  # системных библиотек и не должен зависеть от того, собрался ли проект.
  supply-chain:
    name: supply chain (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo deny check
        run: bash packaging/cargo-deny-check.sh

  # Заявленный `rust-version = "1.95"` проверяется не словом, а компилятором:
  # без этого job MSRV дрейфует молча, стоит зависимости поднять требования.
  msrv:
    name: MSRV 1.95
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo timeout 120 apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::ForceIPv4=true \
            || echo "apt-get update не завершился вовремя; используются текущие списки"
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libmpv-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv

      - name: Check on minimum supported Rust
        run: cargo check --all-targets --locked

  macos:
    name: macOS (build/test)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libmpv
        run: brew install mpv

      - name: Export libmpv search path
        run: echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release

  windows:
    name: Windows (check)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  msi:
    name: Windows (MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSYS2 with libmpv
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: >-
            binutils
            mingw-w64-ucrt-x86_64-mpv
          path-type: inherit

      - name: Setup MSVC tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Prepare libmpv import library
        shell: pwsh
        run: ./packaging/windows/prepare-libmpv.ps1 -MpvDll '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\libmpv-2.dll' -OutDir build/mpv-lib

      - name: Build release
        shell: pwsh
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}\build\mpv-lib
        run: cargo build --release --locked

      # Тесты на Windows шли только проверкой компиляции: платформенный
      # контракт (pipe, пути, MPRIS-заглушки) должен исполняться, иначе
      # «покрыт автотестами на windows-latest» — неправда.
      - name: Test
        shell: pwsh
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}\build\mpv-lib
        run: cargo test --all-targets --locked

      - name: Stage application and runtime DLLs
        shell: msys2 {0}
        run: bash packaging/windows/stage-app.sh

      - name: Add MSVC runtime DLLs
        shell: pwsh
        run: |
          $redist = Get-ChildItem "$env:VCINSTALLDIR\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $redist) { throw 'Не найден MSVC CRT redist' }
          Copy-Item "$($redist.FullName)\*.dll" dist/OrbitFM
          Get-ChildItem dist/OrbitFM | Select-Object Name

      - name: Install WiX
        shell: pwsh
        run: dotnet tool update --global wix --version 5.0.2

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build MSI
        shell: pwsh
        run: >-
          ./packaging/windows/build-msi.ps1
          -AppDir dist/OrbitFM
          -Version '${{ steps.version.outputs.value }}'
          -Output 'dist/OrbitFM-${{ steps.version.outputs.value }}-windows-x64.msi'

      - name: Smoke-test MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist -Filter '*.msi' | Select-Object -First 1).FullName
          $log = Join-Path $env:RUNNER_TEMP 'msi-install.log'
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$log`""
          )
          if ($install.ExitCode -notin 0, 3010) {
            Get-Content $log -Tail 100
            throw "msiexec install завершился с кодом $($install.ExitCode)"
          }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\OrbitFM\orbitfm.exe'
          if (-not (Test-Path $exe)) { throw "не найден $exe" }
          $uninstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/x', "`"$msi`"", '/qn', '/norestart'
          )
          if ($uninstall.ExitCode -notin 0, 3010) {
            throw "msiexec uninstall завершился с кодом $($uninstall.ExitCode)"
          }

      - name: Upload MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OrbitFM-windows-x64-msi
          path: dist/*.msi
          if-no-files-found: error

  dmg:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libmpv and packaging tools
        run: brew install mpv dylibbundler librsvg

      - name: Export libmpv search path
        run: echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --release --locked

      - name: Build DMG
        run: bash packaging/macos/build-dmg.sh

      - name: Smoke-test DMG
        run: |
          set -euo pipefail
          dmg=$(ls dist/*.dmg | head -n 1)
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          app="$mount/OrbitFM.app"
          test -x "$app/Contents/MacOS/orbitfm"
          codesign --verify --deep --strict "$app"
          if otool -L "$app/Contents/MacOS/orbitfm" | grep -E '/(opt/homebrew|usr/local)/'; then
            echo "бинарник ссылается на Homebrew" >&2
            exit 1
          fi
          if find "$app/Contents/Frameworks" -name '*.dylib' -exec otool -L {} \; |
            grep -E '/(opt/homebrew|usr/local)/'; then
            echo "dylib ссылается на Homebrew" >&2
            exit 1
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OrbitFM-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  packaging:
    name: desktop metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validators
        run: |
          sudo timeout 120 apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::ForceIPv4=true \
            || echo "apt-get update не завершился вовремя; используются текущие списки"
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils python3-yaml

      - name: Validate desktop entry and AppStream
        run: |
          desktop-file-validate packaging/linux/org.modernbyte.OrbitFM.desktop
          appstreamcli validate --no-net packaging/linux/org.modernbyte.OrbitFM.metainfo.xml

      - name: Check AppImage and native installer script syntax
        run: |
          bash -n packaging/cargo-deny-check.sh
          bash -n packaging/linux/build-appimage.sh
          bash -n packaging/macos/build-dmg.sh
          bash -n packaging/windows/stage-app.sh

      - name: Validate native installer metadata
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          import xml.etree.ElementTree as ET

          plist = plistlib.loads(Path("packaging/macos/Info.plist.in").read_bytes())
          assert plist["CFBundleIdentifier"] == "org.modernbyte.OrbitFM"
          assert plist["CFBundleExecutable"] == "orbitfm"
          assert plist["CFBundleShortVersionString"] == "__VERSION__"

          ET.parse("packaging/windows/orbitfm.wxs")
          print("native installer metadata ok")
          PY

      - name: Parse Windows packaging scripts
        run: |
          pwsh -NoProfile -Command '
            $errors = $null
            foreach ($file in @(
              "packaging/windows/prepare-libmpv.ps1",
              "packaging/windows/build-msi.ps1"
            )) {
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $file), [ref]$null, [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Error $_ }
                exit 1
              }
            }
          '

      - name: Check Flatpak manifest and vendored sources
        run: python3 packaging/linux/check-flatpak-sources.py

      - name: Check Flatpak build script syntax
        run: bash -n packaging/linux/build-flatpak.sh
