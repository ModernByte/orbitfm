name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libmpv-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  packaging:
    name: desktop metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils python3-yaml

      - name: Validate desktop entry and AppStream
        run: |
          desktop-file-validate packaging/linux/org.modernbyte.OrbitFM.desktop
          appstreamcli validate --no-net packaging/linux/org.modernbyte.OrbitFM.metainfo.xml

      - name: Check AppImage script syntax
        run: bash -n packaging/linux/build-appimage.sh

      - name: Check Flatpak manifest and vendored sources
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          import yaml

          manifest = yaml.safe_load(
              Path("packaging/linux/org.modernbyte.OrbitFM.yml").read_text()
          )
          assert manifest["id"] == "org.modernbyte.OrbitFM"
          assert manifest["runtime"] == "org.freedesktop.Platform"
          assert manifest["runtime-version"] == "25.08"
          assert manifest["command"] == "orbitfm"
          assert any(module["name"] == "orbitfm" for module in manifest["modules"])

          lock = tomllib.loads(Path("Cargo.lock").read_text())
          expected = {
              f"{package['name']}-{package['version']}"
              for package in lock["package"]
              if package.get("source", "").startswith("registry+")
          }
          sources = __import__("json").loads(
              Path("packaging/linux/flatpak-cargo-sources.json").read_text()
          )
          vendored = {
              source["dest"].removeprefix("cargo/vendor/")
              for source in sources
              if source.get("dest", "").startswith("cargo/vendor/")
          }
          missing = expected - vendored
          assert not missing, f"cargo-sources.json не содержит: {sorted(missing)}"
          print(f"manifest ok, vendored crates: {len(vendored)}")
          PY

      - name: Check Flatpak build script syntax
        run: bash -n packaging/linux/build-flatpak.sh
