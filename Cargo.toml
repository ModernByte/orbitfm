[package]
name = "orbitfm"
version = "0.16.0-rc.2"
edition = "2024"
rust-version = "1.95"
description = "3D Interactive Global Radio Player"
repository = "https://github.com/ModernByte/orbitfm"
license = "MIT"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    # CJK-шрифты берутся из системы через fontconfig — шрифты не бандлим (ADR-0030 §7).
    "system_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
egui-wgpu = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
# egui 0.37 не прокидывает epaint/color_fonts, а цветные эмодзи-флаги нужны по эскизу.
# Прямая зависимость включает фичу через feature-unification; новых crate'ов нет
# (vello_cpu/skrifa уже в дереве). Обоснование — ADR-0017.
epaint = { version = "0.37", features = ["color_fonts"] }
geo = { version = "0.33", default-features = false }
geojson = "1.0"
glam = "0.34"
# Только растровые форматы из allowlist ADR-0025: SVG/GIF/ICO не декодируются.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
libmpv2 = { version = "6.0", default-features = false }
playwire = "2.0"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "rustls",
] }
rstar = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
wgpu = "30"

[target.'cfg(target_os = "linux")'.dependencies]
# Системный трей по SNI (ADR-0020). Только Linux: на других ОС модуль — no-op.
ksni = { version = "0.3.7", features = ["blocking"], optional = true }

[target.'cfg(windows)'.dependencies]
# Скрытое top-level окно под HWND для SMTC (ADR-0024). Win32_Graphics_Gdi нужна
# для компиляции WNDCLASSW в windows-rs.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Трей в строке меню (ADR-0026, п. 5–8): tray-icon создаёт NSStatusItem и
# требует уже запущенного run loop на главном потоке, muda строит меню и
# обновляет пункты. default-features выключены: на macOS GTK-графа нет.
muda = { version = "0.21.2", default-features = false, optional = true }
tray-icon = { version = "0.26.1", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# Подмножество `pedantic`, а не группа целиком: на ~44k LOC blanket-включение
# даёт лавину, которая блокирует точечные правки. Уровень `warn`, а CI поднимает
# их в ошибки флагом `-D warnings` (docs/CONTRIBUTING.md).
match_same_arms = "warn"
map_unwrap_or = "warn"
manual_let_else = "warn"
needless_borrow = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
useless_vec = "warn"

[features]
default = ["tray"]
# На каждой платформе собирается только её зависимость: ksni на Linux,
# tray-icon/muda на macOS (ADR-0020, ADR-0026).
tray = ["dep:ksni", "dep:tray-icon", "dep:muda"]
