[package]
name = "orbitfm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "3D Interactive Global Radio Player"
repository = "https://github.com/ModernByte/orbitfm"
license = "MIT"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
egui-wgpu = "0.37"
geo = { version = "0.33", default-features = false }
geojson = "1.0"
glam = "0.34"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libc = "0.2"
libmpv2 = { version = "6.0", default-features = false }
playwire = "2.0"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "rustls",
] }
rstar = "0.13"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.54", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
wgpu = "30"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"
