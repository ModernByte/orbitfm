# Контур поставки OrbitFM — конфигурация `cargo deny` (QA-01, ADR-0011).
#
# Список лицензий ниже — не список пожеланий, а результат замера собственного
# графа: 558 пакетов `Cargo.lock`. Любая новая зависимость с лицензией вне
# списка делает job `supply-chain` красным, и это намеренно: id добавляется в
# `allow` только вместе с обоснованием в ADR.
#
# Предупреждения об устаревшем (`unmaintained`) и выключенном из реестра
# (`yanked`) стоят ниже отказа осознанно — red-сигнал нельзя превращать в шум,
# который учатся пролистывать. Отказывают: лицензия вне списка, чужой источник,
# wildcard-зависимость и любая уязвимость, кроме явно прощённых ниже.
#
# Инвариант `ignore` — не пустота, а дисциплина: каждая запись обязана нести
# комментарий `revisit: ГГГГ-ММ-ДД` с **триггером** пересмотра, а не просто
# датой. Шаг CI роняет job, когда дата наступает. Игнорирование не имеет права
# пережить того, кто его завёл.

[advisories]
# Уязвимости в cargo-deny 0.20 проверяются без уровня лина — отказ включает
# всегда; смягчить его можно только записью в `ignore` ниже. `unmaintained` и
# `unsound` задаются не уровнем, а охватом графа: смотрим все пакеты, включая
# транзитивные.
yanked = "warn"
unmaintained = "all"
unsound = "all"
# Пять записей ниже — не «шум, который достал», а единственный доступный способ
# не делать job вечно красным. Все пять — семья `zbus 5.19.0` и её
# `quick-xml 0.38.4`, и upgrade к ним сегодня **не существует**: `zbus_xml 5.1.0`
# semver-заперт на `quick-xml ^0.38`, а на `zbus 5` стоят все три наших
# потребителя — `eframe`+`accesskit`, `playwire 2.0.0` и `ksni 0.3.7`, причём и
# `playwire 2.0.0`, и `ksni 0.3.7` — последние выложенные версии. RustSec по
# этим же причинам отвечает «No safe upgrade is available!».
#
# Про reachability честно и без самоутешения: оба DoS требуют XML с десятками
# тысяч атрибутов или объявлений пространств имён в одном стартовом теге. В
# OrbitFM quick-xml вызывается только `zbus_xml` для интроспекции **локальной
# сессийной шины**; удалённый XML приложение не разбирает вообще (Radio Browser
# — JSON, плейлисты — свой парсер, артворк — растры). Атака возможна лишь от
# того, кто уже управляет session bus, а это ровно тот же круг, которому
# доступен наш сокет IPC, — см. threat model в `SECURITY.md`.
#
# Триггер пересмотра у всех пяти один: `playwire`/`ksni` переходят на `zbus 6`
# (или `zbus_xml` с `quick-xml >= 0.41`) и граф перестаёт тянуть 0.38.
ignore = [
  # revisit: 2027-01-31 — перепроверить граф на zbus 6
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38.4 тянется только через zbus_xml 5.1 (zbus 5); fixed в 0.41 недоступен semver-ограничением потребителя; путь — локальная D-Bus интроспекция, удалённый XML не разбирается" },
  # revisit: 2027-01-31 — перепроверить граф на zbus 6
  { id = "RUSTSEC-2026-0195", reason = "то же ограничение и тот же путь достижимости, что у RUSTSEC-2026-0194" },
  # revisit: 2027-01-31 — zvariant 5 снят с поддержки в пользу zbus 6
  { id = "RUSTSEC-2026-0371", reason = "zvariant 5 больше не отдельный поддерживаемый crate; миграция возможна только вместе с zbus 6, которого у playwire/ksni пока нет" },
  # revisit: 2027-01-31 — zbus_names 5 снят с поддержки в пользу zbus 6
  { id = "RUSTSEC-2026-0370", reason = "zbus_names 5 больше не отдельный поддерживаемый crate; то же ограничение, что у RUSTSEC-2026-0371" },
  # revisit: 2027-01-31 — derive-макросы переехали в zbus 6
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 больше не поддерживается отдельно; те же ограничения, что у RUSTSEC-2026-0371" },
]

[licenses]
private = { ignore = true }
allow = [
  "0BSD",
  "Apache-2.0",
  # `rustix`, `linux-raw-sys`, `wasi`, `wit-bindgen` объявлены именно так.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Пермиссивная лицензия на данные набора корневых сертификатов.
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  # `libmpv2` и `libmpv2-sys` — единственные copyleft-пакеты графа.
  # Обязательства LGPL-2.1 покрываются динамической линковкой: ни AppImage,
  # ни MSI, ни DMG не всасывают libmpv статически и сохраняют возможность
  # заменить её. Обоснование — ADR-0011.
  "LGPL-2.1",
  "MIT",
  "MIT-0",
  # Шрифты `epaint_default_fonts`.
  "OFL-1.1",
  "Unlicense",
  "Unicode-3.0",
  # Единственный id в списке, которого нет в SPDX-перечне лицензий: он встречается
  # внутри выражения `(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0` пакета
  # `epaint_default_fonts`. Форма со строчной `f` — ровно та, что объявлена в
  # crate: парсер cargo-deny принимает её как термин, а `Ubuntu-Font-1.0` с
  # прописной отвергает как неизвестный term, и тогда пакет считается лицензией
  # вне списка.
  "Ubuntu-font-1.0",
  "Zlib",
]

[bans]
# Граф на ~550 пакетов дублирует версии по построению: `deny` превратил бы
# job в вечный красный, поэтому `warn` — с намерением читать эти предупреждения
# при обновлении зависимостей, а не при каждом пуше.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Одна запись покрывает обе протокольные формы: `Cargo.lock` всегда фиксирует
# канонический URL индекса, даже когда резолв шёл через sparse-index (проверено:
# вторая форма `https://index.crates.io/` даёт warning[unmatched-source]).
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
]
allow-git = []
