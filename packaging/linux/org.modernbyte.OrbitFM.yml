id: org.modernbyte.OrbitFM
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: orbitfm

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-run/pipewire-0
  - --own-name=org.mpris.MediaPlayer2.OrbitFM

cleanup:
  - '*.la'
  - '*.a'
  - /include
  - /lib/pkgconfig
  - /share/ffmpeg
  - /share/man
  - /lib/python3.13

modules:
  - name: python3-jinja2
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --ignore-installed --prefix=/app --root-user-action=ignore *.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/62/a1/3d680cbfd5f4b8f15abc1d571870c5fc3e594bb582bc3b64ea099db13e56/jinja2-3.1.6-py3-none-any.whl
        sha256: 85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67
      - type: file
        url: https://files.pythonhosted.org/packages/0c/91/96cf928db8236f1bfab6ce15ad070dfdd02ed88261c2afafd4b43575e9e9/MarkupSafe-3.0.2-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
        sha256: 15ab75ef81add55874e7ab7055e9c397312385bd9ced94920f2802310c930396

  - name: libplacebo
    buildsystem: meson
    build-options:
      env:
        PYTHONPATH: /app/lib/python3.13/site-packages
    config-opts:
      - -Ddemos=false
      - -Dtests=false
      - -Dbench=false
      - -Dvulkan=disabled
      - -Dvk-proc-addr=disabled
      - -Dopengl=disabled
      - -Dd3d11=disabled
      - -Dglslang=disabled
      - -Dshaderc=disabled
      - -Dlcms=disabled
      - -Ddovi=disabled
      - -Dlibdovi=disabled
      - -Dunwind=disabled
      - -Dxxhash=disabled
    sources:
      - type: archive
        url: https://github.com/haasn/libplacebo/archive/refs/tags/v7.360.1.tar.gz
        sha256: d05fdf90bea2f629eaa2d115e909fd356388ac639e54f77b87a018a6d76224bd

  - name: libass
    buildsystem: meson
    config-opts:
      - -Dtest=disabled
      - -Dcompare=disabled
      - -Dprofile=disabled
      - -Dfuzz=disabled
      - -Dcheckasm=disabled
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dlua=disabled
      - -Dalsa=disabled
      - -Djack=disabled
      - -Dpulse=enabled
      - -Dpipewire=enabled
      - -Dcdda=disabled
      - -Ddvbin=disabled
      - -Ddvdnav=disabled
      - -Dlibbluray=disabled
      - -Dlibarchive=disabled
      - -Duchardet=disabled
      - -Dlcms2=disabled
      - -Djpeg=disabled
      - -Dzimg=disabled
      - -Drubberband=disabled
      - -Dvapoursynth=disabled
      - -Djavascript=disabled
      - -Dcplugins=disabled
      - -Dx11=disabled
      - -Dwayland=disabled
      - -Dgl=disabled
      - -Dvulkan=disabled
      - -Dvaapi=disabled
      - -Dvdpau=disabled
      - -Ddrm=disabled
      - -Dgbm=disabled
      - -Dshaderc=disabled
      - -Dspirv-cross=disabled
      - -Dplain-gl=disabled
      - -Dsixel=disabled
      - -Dcaca=disabled
      - -Dxv=disabled
      - -Dmanpage-build=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  - name: orbitfm
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/orbitfm/cargo
        LIBRARY_PATH: /app/lib
        PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/share/pkgconfig
    build-commands:
      - cargo build --release --locked --offline
      - install -Dm755 target/release/orbitfm /app/bin/orbitfm
      - install -Dm644 packaging/linux/org.modernbyte.OrbitFM.desktop /app/share/applications/org.modernbyte.OrbitFM.desktop
      - install -Dm644 packaging/linux/org.modernbyte.OrbitFM.metainfo.xml /app/share/metainfo/org.modernbyte.OrbitFM.metainfo.xml
      - install -Dm644 packaging/linux/org.modernbyte.OrbitFM.svg /app/share/icons/hicolor/scalable/apps/org.modernbyte.OrbitFM.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - target
      - type: inline
        contents: |
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "cargo/vendor"
        dest: .cargo
        dest-filename: config.toml
      - flatpak-cargo-sources.json
